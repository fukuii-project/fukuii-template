# Dependabot — fukuii-project baseline.
# 7-day cooldown blocks brand-new (potentially compromised) releases; security
# advisories bypass the cooldown automatically. Add your language ecosystem(s)
# below by uncommenting — each MUST keep the cooldown block.
version: 2
updates:
  # No semver-major-days: GitHub's cooldown support table lists GitHub Actions
  # as "Default days supported / SemVer-bump days NOT supported" (verified live
  # against the table, 2026-08-21). Absence here is deliberate — do not add it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # --- uncomment the ecosystem(s) this repo uses ---
  #
  # `sbt` covers Scala projects via root-level `build.sbt` — version updates
  # only, NOT security updates (GitHub's own distinction; sbt support shipped
  # 2026-05-26). Scala Steward (a separate workflow, `.scala-steward.conf`) is
  # complementary if adopted, not a substitute — it does not close the
  # security-update gap sbt support leaves open.
  #
  # - package-ecosystem: "sbt"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7, semver-major-days: 21 }
  #
  # `npm` covers npm, pnpm, and yarn (detected from the lockfile) — use it for
  # Astro / Next / Vite frontends (e.g. the website uses Astro + pnpm).
  #
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7, semver-major-days: 21 }
  #
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7, semver-major-days: 21 }
  #
  # - package-ecosystem: "gomod"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7, semver-major-days: 21 }
  #
  # - package-ecosystem: "cargo"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7, semver-major-days: 21 }
  #
  # No semver-major-days here either: Docker's SemVer-bump column is also "not
  # supported" in that same table (sentinel, 2026-08-21) — default-days only.
  #
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7 }
